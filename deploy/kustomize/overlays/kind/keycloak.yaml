apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: juggernaut-system
data:
  realm-juggernaut.json: |
    {"_comment": "replace with deploy/keycloak/realm-juggernaut.json via kustomize configMapGenerator or helm"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: juggernaut-system
  labels: { app.kubernetes.io/name: keycloak }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: keycloak }
  template:
    metadata:
      labels: { app.kubernetes.io/name: keycloak }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.3
          args: ["start-dev", "--import-realm", "--http-port=8180", "--hostname=http://localhost:8180"]
          env:
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: admin }
            - { name: KC_FEATURES, value: "token-exchange:v2" }
          ports: [{ containerPort: 8180, name: http }]
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
          resources:
            requests: { cpu: 200m, memory: 600Mi }
            limits: { cpu: "2", memory: 1Gi }
      volumes:
        - name: realm
          configMap: { name: keycloak-realm }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: juggernaut-system
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: keycloak }
  ports: [{ port: 8180, targetPort: http, nodePort: 30880 }]
