{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "juggernaut.labels" . | nindent 4 }}
    app.kubernetes.io/name: juggernaut-redis
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: juggernaut-redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: juggernaut-redis }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"{{ if .Values.secrets.redisPassword }}, "--requirepass", "$(REDIS_PASSWORD)"{{ end }}]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "juggernaut.secretName" . }}, key: redis-password } }
          ports: [{ containerPort: 6379, name: redis }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts: [{ name: data, mountPath: /data }]
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
spec:
  selector: { app.kubernetes.io/name: juggernaut-redis }
  ports: [{ port: 6379, targetPort: redis }]
{{- end }}
